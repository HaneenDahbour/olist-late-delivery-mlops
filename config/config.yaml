# Central configuration for the Task 3 inference service.
# Nothing in src/ or app/ hardcodes a path, a column name, or the
# decision threshold — everything below is the single source of truth,
# loaded once at startup via src/olist_mlops/config.py.

paths:
  # All paths are relative to the repository root (auto-detected by
  # locating this config.yaml file, same trick notebooks 5/6 use with
  # docker-compose.yml).
  artifacts_dir: artifacts
  local_preprocessor: artifacts/notebook5_preprocessor.joblib
  local_feature_list: artifacts/notebook5_feature_list.json
  local_model: artifacts/notebook6_trained_model.joblib
  local_manifest: artifacts/notebook5_manifest.json
  local_results: artifacts/notebook6_results.json
  prediction_log_dir: logs/predictions
  service_log_dir: logs/service

model:
  # Frozen in notebooks/06_train_tune_evaluate.ipynb, section 8.
  # The service must load this value from config, never recompute it.
  name: olist-late-delivery
  algorithm: LogisticRegression
  decision_threshold: 0.692968487739563
  expected_feature_count: 184
  target_column: is_late
  positive_label: "late"
  negative_label: "on_time"

mlflow:
  tracking_uri: ${MLFLOW_TRACKING_URI:-http://localhost:5000}
  registry_model_name: olist-late-delivery
  registry_stage: Production
  experiment_name: olist-late-delivery

artifact_store:
  # S3-compatible store (MinIO in docker-compose). DVC pushes/pulls here
  # and the API falls back here if MLflow is unreachable.
  endpoint_url: ${ARTIFACT_STORE_ENDPOINT:-http://localhost:9000}
  bucket: olist-mlops-artifacts
  access_key_env: ARTIFACT_STORE_ACCESS_KEY
  secret_key_env: ARTIFACT_STORE_SECRET_KEY

database:
  host: ${POSTGRES_HOST:-localhost}
  port: ${POSTGRES_PORT:-5432}
  name: ${POSTGRES_DB:-olist}
  user: ${POSTGRES_USER:-olist_user}
  password_env: POSTGRES_PASSWORD

api:
  host: 0.0.0.0
  port: 8000
  max_batch_size: 500
  title: Olist Late-Delivery Prediction API
  version: "1.0.0"

logging:
  level: INFO
  format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
  console: true
  file: true
  max_bytes: 10485760
  backup_count: 5

monitoring:
  prediction_log_backend: postgres   # postgres | file
  drift_check_window_days: 7
  latency_alert_ms: 500
  error_rate_alert_pct: 5

# --- Prediction-time feature contract ------------------------------
# This is a byte-for-byte transcription of the BASE_NUMERIC_FEATURES /
# BASE_CATEGORICAL_FEATURES / TIME_SOURCE_COLUMNS / FORBIDDEN_COLUMNS
# constants defined identically in notebooks/05_feature_engineering.ipynb
# and notebooks/06_train_tune_evaluate.ipynb. Any drift between this
# list and the notebooks is caught by
# tests/test_notebook_parity.py::test_feature_contract_matches_notebooks.
feature_contract:
  numeric_features:
    - item_count
    - unique_product_count
    - unique_seller_count
    - item_price_total
    - item_price_mean
    - item_price_max
    - freight_value_total
    - freight_value_mean
    - unique_product_category_count
    - product_name_length_mean
    - product_description_length_mean
    - product_photos_qty_mean
    - product_weight_g_total
    - product_weight_g_mean
    - product_length_cm_mean
    - product_height_cm_mean
    - product_width_cm_mean
    - primary_category_item_count
    - unique_seller_city_count
    - unique_seller_state_count
    - primary_seller_item_count
    - payment_record_count
    - unique_payment_type_count
    - payment_value_total
    - payment_value_mean
    - payment_installments_max
    - payment_installments_mean
    - primary_payment_type_value
    - primary_payment_type_record_count
    - customer_lat_median
    - customer_lng_median
    - customer_geolocation_record_count
    - primary_seller_lat_median
    - primary_seller_lng_median
    - primary_seller_geolocation_record_count

  categorical_features:
    - customer_record_found
    - customer_state
    - primary_seller_state
    - primary_product_category
    - primary_payment_type

  timestamp_features:
    - order_purchase_timestamp
    - order_approved_at
    - order_estimated_delivery_date
    - shipping_limit_date_min
    - shipping_limit_date_max

  # Deterministic features computed inside build_prediction_features()
  # from the raw fields above. Not accepted directly on the request.
  engineered_features:
    - approval_delay_hours
    - estimated_delivery_window_days
    - shipping_limit_min_days
    - shipping_limit_max_days
    - shipping_limit_span_days
    - purchase_month
    - purchase_day_of_week
    - purchase_hour
    - customer_seller_distance_km
    - freight_to_price_ratio
    - customer_seller_same_state

  # A request containing any of these is rejected with HTTP 422.
  # These are exactly notebooks 5/6's FORBIDDEN_COLUMNS set.
  forbidden_columns:
    - order_id
    - customer_id
    - customer_unique_id
    - primary_seller_id
    - order_status
    - order_delivered_carrier_date
    - order_delivered_customer_date
    - delivery_delay_days
    - post_delivery_review_count
    - post_delivery_review_score_mean
    - post_delivery_review_score_min
    - post_delivery_review_score_max
    - post_delivery_review_title_count
    - post_delivery_review_message_count
    - post_delivery_review_message_length_mean
    - post_delivery_review_creation_date_min
    - post_delivery_review_answer_timestamp_max
    - is_late
