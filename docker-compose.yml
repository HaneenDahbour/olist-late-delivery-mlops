services:
  postgres:
    image: postgres:16
    container_name: olist-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-olist}
      POSTGRES_USER: ${POSTGRES_USER:-olist_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-olist_password}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data:/data:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-olist_user} -d ${POSTGRES_DB:-olist}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # minio/minio on Docker Hub is deprecated in favor of quay.io.
    image: quay.io/minio/minio:latest
    container_name: olist-minio

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}

    command: server /data --console-address ":9001"

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  create-bucket:
    # minio/mc on Docker Hub is deprecated in favor of quay.io.
    image: quay.io/minio/mc:latest
    container_name: olist-create-bucket
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/olist-mlops-artifacts
      "

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    container_name: olist-mlflow

    depends_on:
      postgres:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully

    environment:
      AWS_ACCESS_KEY_ID: ${ARTIFACT_STORE_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${ARTIFACT_STORE_SECRET_KEY:-minioadmin123}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000

    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --allowed-hosts "mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000"
      --backend-store-uri postgresql+psycopg://${POSTGRES_USER:-olist_user}:${POSTGRES_PASSWORD:-olist_password}@postgres:5432/${POSTGRES_DB:-olist}
      --artifacts-destination s3://olist-mlops-artifacts/mlflow
      --serve-artifacts

    ports:
      - "5000:5000"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  register-model:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: olist-register-model

    depends_on:
      mlflow:
        condition: service_healthy

    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_DISABLE_AGENT_HINT: "1"
      AWS_ACCESS_KEY_ID: ${ARTIFACT_STORE_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${ARTIFACT_STORE_SECRET_KEY:-minioadmin123}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000

    volumes:
      - ./artifacts:/srv/artifacts:ro

    entrypoint: ["python", "scripts/register_model.py"]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: olist-api

    depends_on:
      mlflow:
        condition: service_healthy
      postgres:
        condition: service_healthy
      register-model:
        condition: service_completed_successfully

    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_DISABLE_AGENT_HINT: "1"
      AWS_ACCESS_KEY_ID: ${ARTIFACT_STORE_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${ARTIFACT_STORE_SECRET_KEY:-minioadmin123}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-olist}
      POSTGRES_USER: ${POSTGRES_USER:-olist_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-olist_password}
      ARTIFACT_STORE_ENDPOINT: http://minio:9000
      ARTIFACT_STORE_ACCESS_KEY: ${ARTIFACT_STORE_ACCESS_KEY:-minioadmin}
      ARTIFACT_STORE_SECRET_KEY: ${ARTIFACT_STORE_SECRET_KEY:-minioadmin123}

    ports:
      - "8000:8000"

volumes:
  postgres_data:
  minio_data:
