repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(src|app|scripts|tests)/

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        files: ^(src|app|scripts|tests)/

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy src app scripts
        language: system
        pass_filenames: false
        files: ^(src|app|scripts)/
