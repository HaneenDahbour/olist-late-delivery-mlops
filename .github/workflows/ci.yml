name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install --no-deps -e .

      - name: ruff
        run: ruff check src app scripts tests

      - name: black --check
        run: black --check src app scripts tests

      - name: mypy
        run: mypy src app scripts

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install --no-deps -e .

      # tests/conftest.py skips notebook-parity/model/API tests when the
      # gitignored local artifacts and processed data (produced by running
      # notebooks 01-06) aren't present, which is always true in CI. Those
      # skips are expected here — this job proves the pure-Python unit/data
      # tests pass; parity/model/API tests only run where the artifacts do
      # (a machine that has run the notebooks, e.g. locally).
      - name: pytest
        run: pytest -v

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t olist-mlops-api:${{ github.sha }} .

      # Pushes to GitHub Container Registry using the token GitHub issues
      # automatically for every run — no manually-configured registry
      # secret needed. Only pushes from main, after lint+test passed, and
      # never from a pull request (a PR's GITHUB_TOKEN can't write packages).
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE=ghcr.io/$OWNER/olist-mlops-api
          docker tag olist-mlops-api:${{ github.sha }} $IMAGE:${{ github.sha }}
          docker tag olist-mlops-api:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
