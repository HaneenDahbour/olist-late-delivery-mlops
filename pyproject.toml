[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-mlops"
version = "1.0.0"
description = "Olist late-delivery prediction inference service (Task 3)"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
# Without this, `from tests.conftest import ...` only resolves when
# invoked as `python -m pytest` (which inserts cwd into sys.path) — a
# bare `pytest` invocation (e.g. GitHub Actions' default) fails with
# ModuleNotFoundError: No module named 'tests'.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
